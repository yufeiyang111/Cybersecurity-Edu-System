name: CI/CD Pipeline

on:
  push:
    branches:
      - master

jobs:
  # ==========================================
  # 阶段 1：自动测试与构建门禁（CI）
  # ==========================================
  test:
    name: Run Tests & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Backend Tests
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pytest tests -q

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Frontend Build Check
        working-directory: frontend
        run: |
          npm ci
          npm run build

  # ==========================================
  # 阶段 2：全自动云端部署（CD）
  # ==========================================
  deploy:
    name: Deploy to Server via SSH
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Deploy to Cloud Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 开始自动化部署 CyberGuard..."
            
            # 进入服务器上的项目目录（默认 /opt/cyberguard）
            APP_DIR="${{ secrets.SERVER_APP_DIR || '/opt/cyberguard' }}"
            cd $APP_DIR || exit 1
            
            # 1. 拉取最新代码
            echo "📦 拉取 master 分支最新代码..."
            git pull origin master
            
            # 2. 重新构建并平滑启动 Docker 容器组
            echo "🐳 重新构建并重启 Docker 容器..."
            docker compose up -d --build --remove-orphans
            
            # 3. 容器内自动应用数据库迁移
            echo "🔄 执行数据库加性迁移..."
            docker compose exec -T backend flask --app run apply-security-migrations
            
            # 4. 清理旧镜像释放磁盘
            docker image prune -f
            
            echo "✅ 部署完成！服务已通过 Caddy 正常提供 HTTPS 访问。"
